<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Годинник</title>
</head>
<body onLoad="clock()">
    <a style="display:block; text-align:right" href="home_index.html">
На головну дисципліни
</a>
    <form name="clock">
        Час: <input type="text" name="time" size="10" value=""><br>
        Дата: <input type="text" name="date" size="15" value="">
    </form>

    <script Language="JavaScript">
        let timeStr, dateStr;
        function clock() {
            let now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            timeStr = hours + "/";
            timeStr += (minutes < 10 ? "0" : "") + minutes + "/";
            timeStr += (seconds < 10 ? "0" : "") + seconds;
            document.clock.time.value = timeStr;

            let day = now.getDate();
            let month = now.getMonth() + 1;
            let year = now.getFullYear();

            dateStr = year + "*";
            dateStr += (month < 10 ? "0" : "") + month + "*";
            dateStr += (day < 10 ? "0" : "") + day;
            document.clock.date.value = dateStr;

            setTimeout("clock()", 1000);
        }
    </script>
</body>
</html>
