    <h3>Результати виконання виведені в консоль F12</h3>
    <script>
        let a = 15;
        let b = 4;
        
        // 1. Вивід остачі від ділення
        console.log("Остача від ділення " + a + " на " + b + " = " + (a % b));
        
        // 2. Вивід логічного значення
        console.log("Чи дорівнює остача нулю (a % b == 0)?", (a % b === 0));
        console.log("Чи дорівнює остача нулю (a % 5 == 0)?", (a % 5 === 0));
        
        // 3. Комбінований вивід з керуючими послідовностями
        let arr = [100, 200, 300];
        console.log("Значення масиву: %d, %d, %d", arr[0], arr[1], arr[2]);
        console.log("Другий елемент масиву як рядок: %s", arr[1]);
    </script>
