<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Матриця - Варіант 9</title>
    <script>
        let str, stb;

        function fun() {
            str = parseInt(document.getElementById('t_str').value);
            stb = parseInt(document.getElementById('t_stb').value);
            
            let res_str = "<table border='1' style='border-collapse: collapse;'>\n";
            for (let i = 1; i <= str; i++) {
                res_str += "<tr>\n";
                for (let j = 1; j <= stb; j++) {
                    let val = 5 * i + 3 * j;
                    res_str += "<td>";
                    res_str += "<input type='text' id='_" + i + "_" + j + "' value='" + val + "' size='3'>";
                    res_str += "</td>\n";
                }
                res_str += "</tr>\n";
            }
            res_str += "</table>";
            document.getElementById('main_div').innerHTML = res_str;
        }

        function fun_build() {
            let sum = 0;
            let min_dim = Math.min(str, stb);

            for (let i = 1; i <= min_dim; i++) {
                let element = document.getElementById('_' + i + '_' + i);
                if (element) {
                    sum += parseInt(element.value);
                }
            }
            alert("Сума елементів головної діагоналі = " + sum);
        }
    </script>
</head>
<body>
        <a style="display:block; text-align:right" href="home_index.html">
На головну дисципліни
</a>
    <form id="main_form">
        <table>
            <tr>
                <td>Кількість строк</td>
                <td><input type="text" id="t_str" value="5"></td>
            </tr>
            <tr>
                <td>Кількість стовбців</td>
                <td><input type="text" id="t_stb" value="5"></td>
            </tr>
            <tr>
                <td><input type="button" onClick="fun();" value="Побудувати матрицю"></td>
            </tr>
            <tr>
                <td><input type="button" onClick="fun_build();" value="Розрахувати"></td>
            </tr>
        </table>
        <div id="main_div" style="margin-top: 10px;"></div>
    </form>
</body>
</html>
