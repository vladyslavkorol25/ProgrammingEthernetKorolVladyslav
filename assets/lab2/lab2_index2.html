<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Калькулятор</title>
    <style>
        .calc { width: 200px; padding: 10px; border: 1px solid #000; }
        .calc input { width: 100%; margin-bottom: 10px; box-sizing: border-box; text-align: right; }
        .calc button { width: 40px; height: 40px; margin: 2px; cursor: pointer; }
    </style>
</head>
<body>
    <a style="display:block; text-align:right" href="home_index.html">
На головну дисципліни
</a>
    <div class="calc">
        <input type="text" id="display" readonly>
        <div>
            <button onclick="add('7')">7</button>
            <button onclick="add('8')">8</button>
            <button onclick="add('9')">9</button>
            <button onclick="add('/')">/</button>
        </div>
        <div>
            <button onclick="add('4')">4</button>
            <button onclick="add('5')">5</button>
            <button onclick="add('6')">6</button>
            <button onclick="add('*')">*</button>
        </div>
        <div>
            <button onclick="add('1')">1</button>
            <button onclick="add('2')">2</button>
            <button onclick="add('3')">3</button>
            <button onclick="add('-')">-</button>
        </div>
        <div>
            <button onclick="add('0')">0</button>
            <button onclick="add('.')">.</button>
            <button onclick="calculate()">=</button>
            <button onclick="add('+')">+</button>
        </div>
        <div>
            <button onclick="clearDisplay()" style="width: 100%;">C</button>
        </div>
    </div>

    <script>
        function add(value) {
            document.getElementById('display').value += value;
        }

        function clearDisplay() {
            document.getElementById('display').value = '';
        }

        function calculate() {
            let display = document.getElementById('display');
            try {
                display.value = eval(display.value);
            } catch (e) {
                display.value = 'Помилка';
            }
        }
    </script>
</body>
</html>
