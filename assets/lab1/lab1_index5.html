<html>
<head>
<script>
function fun()
{
    let x, y, sum = 0.0;
    x = parseFloat(main_form.t_x.value);
    y = parseFloat(main_form.t_y.value);

    for (let i = 4; i <= 6; i++) {
        let factorial = 1;
        
        for (let j = 1; j <= i; j++) {
            factorial *= j;
        }
        
        let cur = Math.pow(-1, i) * (2 * x - y) / factorial;
        sum += cur;
    }
    
    main_form.t_c.value = "" + sum;
}
</script>
</head>
<body>
    <a style="display:block; text-align:right" href="lab1_home_index.html">
На головну дисципліни
</a>
    <h3>Завдання 5</h3>
<form id="main_form">
x=<input type="text" id="t_x" value="10"><br>
y=<input type="text" id="t_y" value="-2"><br>
Результат:<input type="text" id="t_c" value=""><br>
<input type="button" onClick="fun();" value="Розрахувати">
</form>
</body>
</html>
