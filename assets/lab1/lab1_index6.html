<HTML>
<HEAD>
<SCRIPT LANGUAGE="JavaScript">

let product = new Array(6);
product = ["Клавіатура", "Книга", "Календар", "Кабель", "Калькулятор", "Кружка"];

let quantity = ["15", "40", "25", "60", "18", "30"];
let cost = ["1200", "350", "150", "250", "500", "180"];

let number; 

function fun1() {
    let name = document.form1.name_product.value;

    number = product.indexOf(name);

    if (number != -1) {
        document.form1.output_quantity.value = quantity[number];
        document.form1.output_cost.value = cost[number];
    } else {
        document.form1.output_quantity.value = "Товар не знайдено";
        document.form1.output_cost.value = "Товар не знайдено";
    }
}

function fun2() {
    if (number != undefined && number != -1) {
        let sum = Number(quantity[number]) * Number(cost[number]);

        document.form1.output_sum.value =
            "Загальна сума: " + sum + " грн";
    } else {
        document.form1.output_sum.value =
            "Спочатку знайдіть товар";
    }
}

</SCRIPT>
</HEAD>

<BODY>
    <a style="display:block; text-align:right" href="lab1_home_index.html">
На головну дисципліни
</a>
    <h3>Завдання 5</h3>

<FORM NAME="form1">

Введіть назву товару:

<INPUT TYPE="text" NAME="name_product">

<INPUT TYPE="button"
       VALUE="Наявна кількість і вартість"
       onClick="fun1()">

<BR><BR>

Наявна кількість на складі:

<INPUT TYPE="text"
       SIZE="30"
       NAME="output_quantity">

<BR><BR>

Вартість за одиницю:

<INPUT TYPE="text"
       SIZE="30"
       NAME="output_cost">

<BR><BR>

<INPUT TYPE="button"
       VALUE="Загальна сума"
       onClick="fun2()">

<BR><BR>

<INPUT TYPE="text"
       SIZE="50"
       NAME="output_sum">

</FORM>

</BODY>
</HTML>
