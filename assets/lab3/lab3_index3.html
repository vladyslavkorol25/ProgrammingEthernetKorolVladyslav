<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Інженерний калькулятор</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
        }

        .top-link {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 16px;
            color: #0056b3;
            text-decoration: none;
            font-family: Arial, sans-serif;
            z-index: 1000;
        }
        
        .top-link:hover {
            text-decoration: underline;
        }

        .calculator {
            background-color: #e6f2fb;
            padding: 10px 15px 20px 15px;
            border-radius: 5px;
            border: 1px solid #d0e3f5;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Дисплей */
        .display-container {
            background-color: #ffffff;
            border: 3px solid #b0b0b0;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            height: 85px;
            justify-content: space-between;
        }

        .current-input {
            font-size: 42px;
            color: #333;
            font-weight: normal;
            line-height: 1;
            word-break: break-all;
        }

        .expression {
            font-size: 14px;
            color: #999;
            min-height: 16px;
        }

        /* Верхня панель з іконками та кнопкою перемикання */
        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            color: #b0c4de;
            font-size: 16px;
            padding-left: 5px;
        }

        .icons {
            display: flex;
            gap: 15px;
        }
        
        .icons span {
            cursor: pointer;
            opacity: 0.7;
        }

        /* Кнопка перемикання режимів */
        .toggle-mode {
            background-color: transparent;
            border: 1px solid #0056b3;
            color: #0056b3;
            font-size: 12px;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .toggle-mode:hover {
            background-color: #0056b3;
            color: white;
        }

        /* Контейнер для інженерних кнопок */
        .scientific-pad {
            display: none; /* За замовчуванням приховано */
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .scientific-pad.active {
            display: grid; /* Показуємо при активації */
        }

        /* Сітка основних кнопок */
        .keypad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        button {
            border: 1px solid #c0c0c0;
            border-radius: 3px;
            font-size: 24px;
            padding: 12px 0;
            cursor: pointer;
            background-color: #f4f4f4;
            color: #0056b3;
            font-weight: bold;
            box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,0.1);
            transition: background-color 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:active {
            background-color: #e0e0e0;
        }

        /* Стилі для інженерних кнопок */
        .scientific-pad button {
            font-size: 16px;
            padding: 10px 0;
            background-color: #cce0ff;
            color: #003366;
            border-color: #99c2ff;
        }
        .scientific-pad button:active {
            background-color: #99c2ff;
        }

        .op-btn {
            background-color: #8c8c8c;
            color: #ffffff;
            border-color: #7a7a7a;
            font-weight: normal;
            font-size: 22px;
        }
        .op-btn:active { background-color: #7a7a7a; }

        .clear-btn {
            background-color: #e60000;
            color: #ffffff;
            border-color: #cc0000;
            font-weight: bold;
        }
        .clear-btn:active { background-color: #cc0000; }

        .equal-btn {
            background-color: #0056b3;
            color: #ffffff;
            border-color: #004080;
            grid-column: 5;
            grid-row: 3 / span 2;
            font-size: 28px;
        }
        .equal-btn:active { background-color: #004080; }

        .backspace-btn { font-size: 20px; }
        .negate-btn { font-size: 18px; }

    </style>
</head>
<body>

    <a class="top-link" href="home_index.html">На головну дисципліни</a>

    <div class="calculator">
        <div class="display-container">
            <div class="current-input" id="display">0</div>
            <div class="expression" id="expression"></div>
        </div>

        <div class="top-panel">
            <div class="icons">
                <span>&#9198;</span>
                <span>&#128295;</span>
                <span>&#9881;</span>
            </div>
            <!-- Кнопка перемикання -->
            <button class="toggle-mode" id="toggleBtn" onclick="toggleScientificMode()">Переключити на Інженерний</button>
        </div>

        <!-- Блок інженерних кнопок (прихований за замовчуванням) -->
        <div class="scientific-pad" id="scientificPad">
            <button onclick="applyScientific('sqr')">x²</button>
            <button onclick="applyScientific('sqrt')">√</button>
            <button onclick="applyScientific('sin')">sin</button>
            <button onclick="applyScientific('cos')">cos</button>
            <button onclick="appendNumber(Math.PI.toFixed(4))">π</button>
        </div>

        <div class="keypad">
            <button class="num-btn" onclick="appendNumber('7')">7</button>
            <button class="num-btn" onclick="appendNumber('8')">8</button>
            <button class="num-btn" onclick="appendNumber('9')">9</button>
            <button class="op-btn backspace-btn" onclick="backspace()">&#8594;</button>
            <button class="clear-btn" onclick="clearAll()">C</button>

            <button class="num-btn" onclick="appendNumber('4')">4</button>
            <button class="num-btn" onclick="appendNumber('5')">5</button>
            <button class="num-btn" onclick="appendNumber('6')">6</button>
            <button class="op-btn" onclick="setOperation('*')">&times;</button>
            <button class="op-btn" onclick="setOperation('/')">&divide;</button>

            <button class="num-btn" onclick="appendNumber('1')">1</button>
            <button class="num-btn" onclick="appendNumber('2')">2</button>
            <button class="num-btn" onclick="appendNumber('3')">3</button>
            <button class="op-btn" onclick="setOperation('-')">&minus;</button>
            <button class="equal-btn" onclick="calculate()">=</button>

            <button class="op-btn negate-btn" onclick="toggleSign()">+/-</button>
            <button class="num-btn" onclick="appendNumber('0')">0</button>
            <button class="num-btn" onclick="appendNumber('.')">.</button>
            <button class="op-btn" onclick="setOperation('+')">+</button>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let currentOperation = null;
        let shouldResetDisplay = false;
        let isScientificMode = false;

        const displayElement = document.getElementById('display');
        const expressionElement = document.getElementById('expression');
        const scientificPad = document.getElementById('scientificPad');
        const toggleBtn = document.getElementById('toggleBtn');

        // Функція перемикання режимів
        function toggleScientificMode() {
            isScientificMode = !isScientificMode;
            
            if (isScientificMode) {
                scientificPad.classList.add('active');
                toggleBtn.textContent = "Переключити на Простий";
            } else {
                scientificPad.classList.remove('active');
                toggleBtn.textContent = "Переключити на Інженерний";
            }
        }

        function updateDisplay() {
            displayElement.textContent = currentInput;
            
            if (previousInput !== '' && currentOperation !== null) {
                let opSymbol = currentOperation;
                if (opSymbol === '*') opSymbol = '×';
                if (opSymbol === '/') opSymbol = '÷';
                if (opSymbol === '-') opSymbol = '−';
                if (opSymbol === '^') opSymbol = '^';
                
                expressionElement.textContent = `${previousInput}${opSymbol}${shouldResetDisplay ? '' : currentInput}`;
            } else {
                expressionElement.textContent = '';
            }
        }

        function appendNumber(number) {
            if (currentInput === '0' || shouldResetDisplay) {
                currentInput = number;
                shouldResetDisplay = false;
            } else {
                if (number === '.' && currentInput.includes('.')) return;
                currentInput += number;
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            currentOperation = null;
            shouldResetDisplay = false;
            updateDisplay();
        }

        function toggleSign() {
            if (currentInput !== '0') {
                if (currentInput.startsWith('-')) {
                    currentInput = currentInput.substring(1);
                } else {
                    currentInput = '-' + currentInput;
                }
                updateDisplay();
            }
        }

        function backspace() {
            if (shouldResetDisplay) {
                shouldResetDisplay = false;
                return;
            }
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function setOperation(operation) {
            if (currentOperation !== null && !shouldResetDisplay) {
                calculate();
            }
            previousInput = currentInput;
            currentOperation = operation;
            shouldResetDisplay = true;
            updateDisplay();
        }

        // Функція для миттєвих інженерних обчислень
        function applyScientific(action) {
            let val = parseFloat(currentInput);
            let result = 0;
            let expressionText = '';

            switch(action) {
                case 'sqr':
                    result = val * val;
                    expressionText = `sqr(${val})`;
                    break;
                case 'sqrt':
                    if (val < 0) {
                        result = 'Помилка';
                    } else {
                        result = Math.sqrt(val);
                    }
                    expressionText = `√(${val})`;
                    break;
                case 'sin':
                    // Переводимо градуси в радіани
                    result = Math.sin(val * Math.PI / 180);
                    expressionText = `sin(${val}°)`;
                    break;
                case 'cos':
                    result = Math.cos(val * Math.PI / 180);
                    expressionText = `cos(${val}°)`;
                    break;
            }

            if (typeof result === 'number') {
                result = Math.round(result * 100000000) / 100000000;
            }

            expressionElement.textContent = `${expressionText} = ${result}`;
            currentInput = result.toString();
            shouldResetDisplay = true;
            displayElement.textContent = currentInput;
        }

        function calculate() {
            if (currentOperation === null || previousInput === '') return;
            
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            let opSymbol = currentOperation;

            switch (currentOperation) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; opSymbol = '×'; break;
                case '^': result = Math.pow(prev, current); break;
                case '/': 
                    if (current === 0) {
                        result = 'Помилка';
                    } else {
                        result = prev / current; 
                    }
                    opSymbol = '÷';
                    break;
            }

            if (typeof result === 'number') {
                result = Math.round(result * 100000000) / 100000000;
            }

            expressionElement.textContent = `${previousInput}${opSymbol}${currentInput}=${result}`;

            currentInput = result.toString();
            currentOperation = null;
            previousInput = '';
            shouldResetDisplay = true;
            
            displayElement.textContent = currentInput;
        }
    </script>
</body>
</html>
